<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Your personal exam vocabulary vault — scan pages, collect hard words, revise daily." />
    <meta name="theme-color" content="#4338ca" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <title>VocabVault</title>
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <img src="./icon.svg" alt="" width="28" height="28" />
        <span>VocabVault</span>
      </div>
      <button class="sync-chip" id="syncChip" data-action="sync" type="button" aria-live="polite">Local only</button>
    </header>

    <main id="view" tabindex="-1"></main>

    <nav class="tabbar" aria-label="Main">
      <button type="button" data-nav="today"><span class="ico" aria-hidden="true">☀️</span><span>Today</span></button>
      <button type="button" data-nav="add"><span class="ico" aria-hidden="true">➕</span><span>Add</span></button>
      <button type="button" data-nav="practice"><span class="ico" aria-hidden="true">🎯</span><span>Quiz</span></button>
      <button type="button" data-nav="words"><span class="ico" aria-hidden="true">📚</span><span>Words</span></button>
      <button type="button" data-nav="settings"><span class="ico" aria-hidden="true">⚙️</span><span>Settings</span></button>
    </nav>

    <div id="overlay"></div>
    <div id="toast" role="status" aria-live="polite"></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
