<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="%BRAND_TAGLINE%" />
    <meta name="theme-color" content="%BRAND_COLOR%" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <title>%BRAND_NAME%</title>
  </head>
  <body>
    <header class="topbar">
      <button class="brand" type="button" data-nav="home" aria-label="Start screen">
        <img src="./icon.svg" alt="" width="28" height="28" />
        <span>%BRAND_NAME%</span>
      </button>
      <div class="section-switch" role="group" aria-label="Part of the app">
        <button type="button" data-nav="today" data-sec="vocab">📘<span class="lbl"> Vocab</span></button>
        <button type="button" data-nav="g-today" data-sec="grammar">📗<span class="lbl"> Grammar</span></button>
        <button type="button" data-nav="k-today" data-sec="gk">🌍<span class="lbl"> GK</span></button>
      </div>
      <button class="sync-chip" id="syncChip" data-action="sync" type="button" aria-live="polite">Local only</button>
    </header>

    <main id="view" tabindex="-1"></main>

    <nav class="tabbar" aria-label="Main"></nav>

    <div id="overlay"></div>
    <div id="info"></div>
    <div id="toast" role="status" aria-live="polite"></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
